[project]
name = "sec-alphaops-worker"
version = "0.1.0"
description = "Temporal worker for SEC AlphaOps"
requires-python = ">=3.12"
dependencies = [
    "sec-alphaops-common",
    "sec-alphaops-db",
    "sec-alphaops-workflows",
    "sec-alphaops-langgraph",
    "temporalio>=1.9.0",
    "pydantic-settings>=2.8.1",
    "redis>=5.2.1",
    "boto3>=1.37.5",
    "edgartools>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_alphaops_worker"]

[tool.uv.sources]
sec-alphaops-common = { workspace = true }
sec-alphaops-db = { workspace = true }
sec-alphaops-workflows = { workspace = true }
sec-alphaops-langgraph = { workspace = true }
