[project]
name = "sec-alphaops-api"
version = "0.1.0"
description = "FastAPI service for SEC AlphaOps"
requires-python = ">=3.12"
dependencies = [
    "sec-alphaops-common",
    "sec-alphaops-db",
    "sec-alphaops-workflows",
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.1",
    "redis>=5.2.1",
    "temporalio>=1.9.0",
    "pydantic-settings>=2.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_alphaops_api"]

[tool.uv.sources]
sec-alphaops-common = { workspace = true }
sec-alphaops-db = { workspace = true }
sec-alphaops-workflows = { workspace = true }
