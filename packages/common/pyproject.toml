[project]
name = "sec-alphaops-common"
version = "0.1.0"
description = "Shared contracts, config registries, and schemas"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "redis>=5.2.1",
    "boto3>=1.37.5",
    "temporalio>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_alphaops_common"]
