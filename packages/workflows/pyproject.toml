[project]
name = "sec-alphaops-workflows"
version = "0.1.0"
description = "Temporal workflow definitions"
requires-python = ">=3.12"
dependencies = [
    "sec-alphaops-common",
    "temporalio>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_alphaops_workflows"]

[tool.uv.sources]
sec-alphaops-common = { workspace = true }
